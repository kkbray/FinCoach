<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3157ff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>FinCoach Prototype</title>
    <style>
:root {
  --ink: #121826;
  --muted: #647082;
  --line: rgba(18, 24, 38, 0.1);
  --surface: #fbfcff;
  --panel: rgba(255, 255, 255, 0.82);
  --panel-strong: #ffffff;
  --teal: #13d5b2;
  --blue: #3157ff;
  --violet: #7c4dff;
  --amber: #ffbf47;
  --coral: #ff6f61;
  --green: #159963;
  --shadow: 0 18px 45px rgba(19, 38, 74, 0.15);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: none;
  font-family:
    Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--ink);
  background:
    radial-gradient(circle at 15% 10%, rgba(19, 213, 178, 0.28), transparent 28%),
    radial-gradient(circle at 80% 0%, rgba(255, 191, 71, 0.24), transparent 30%),
    linear-gradient(140deg, #eef8ff 0%, #f7f3ff 48%, #fff8ea 100%);
}

button {
  border: 0;
  font: inherit;
}

.app-shell {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px 12px;
  padding-bottom: calc(24px + env(safe-area-inset-bottom));
}

.phone-frame {
  position: relative;
  width: min(100%, 430px);
  height: min(900px, calc(100vh - 28px));
  min-height: 720px;
  overflow: hidden;
  background: rgba(246, 249, 255, 0.88);
  border: 1px solid rgba(255, 255, 255, 0.74);
  border-radius: 34px;
  box-shadow: var(--shadow);
  backdrop-filter: blur(20px);
}

.top-bar {
  position: relative;
  z-index: 3;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  padding: 18px 20px 12px;
  background: rgba(251, 252, 255, 0.86);
  border-bottom: 1px solid rgba(255, 255, 255, 0.68);
  backdrop-filter: blur(14px);
}

.top-bar-left {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 10px;
  min-width: 0;
}

.eyebrow {
  flex: 0 0 100%;
  margin: 0;
  color: var(--blue);
  font-size: 12px;
  font-weight: 800;
  text-transform: uppercase;
}

h1,
h2,
h3,
p {
  margin-top: 0;
}

h1 {
  margin-bottom: 0;
  font-size: 24px;
  line-height: 1.05;
}

#screen-meta {
  display: inline-flex;
  align-items: center;
  width: fit-content;
  max-width: 100%;
  padding: 3px 8px;
  border-radius: 999px;
  background: rgba(49, 87, 255, 0.08);
  color: var(--ink);
  font-size: 11px;
  font-weight: 700;
  white-space: nowrap;
}

.top-bar-left .habit-link {
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
}

#screen-meta {
  border: 0;
  cursor: pointer;
  text-align: left;
  white-space: nowrap;
}

#screen-meta:hover {
  color: var(--blue);
}

.icon-button,
.nav-item,
.coach-action,
.chip,
.cta,
.choice-button {
  cursor: pointer;
  transition:
    transform 160ms ease,
    box-shadow 160ms ease,
    background 160ms ease;
}

.icon-button:active,
.nav-item:active,
.coach-action:active,
.chip:active,
.cta:active,
.choice-button:active {
  transform: scale(0.98);
}

.icon-button {
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  border-radius: 16px;
  color: var(--ink);
  background: rgba(255, 255, 255, 0.78);
  box-shadow: inset 0 0 0 1px var(--line);
}

.screen {
  height: calc(100% - 94px);
  overflow-y: auto;
  padding: 12px 16px 96px;
  scroll-behavior: smooth;
}

.screen::-webkit-scrollbar {
  width: 0;
}

.coach-hero {
  position: relative;
  overflow: hidden;
  padding: 20px;
  min-height: 290px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  color: #fff;
  border-radius: 28px;
  background:
    radial-gradient(circle at 82% 16%, rgba(255, 191, 71, 0.95), transparent 26%),
    radial-gradient(circle at 15% 5%, rgba(19, 213, 178, 0.75), transparent 28%),
    linear-gradient(145deg, #17234d 0%, #2759d8 48%, #6937d2 100%);
  box-shadow: 0 18px 36px rgba(38, 72, 173, 0.28);
}

.coach-hero.stable {
  background:
    radial-gradient(circle at 82% 16%, rgba(34, 197, 94, 0.58), transparent 26%),
    radial-gradient(circle at 15% 5%, rgba(14, 165, 233, 0.58), transparent 28%),
    linear-gradient(145deg, #14325f 0%, #2456c8 52%, #1f8a62 100%);
}

.coach-hero.watching {
  background:
    radial-gradient(circle at 82% 16%, rgba(250, 204, 21, 0.82), transparent 26%),
    radial-gradient(circle at 15% 5%, rgba(14, 165, 233, 0.55), transparent 28%),
    linear-gradient(145deg, #4b3d14 0%, #b77a13 52%, #1e6491 100%);
}

.coach-hero.critical {
  background:
    radial-gradient(circle at 82% 16%, rgba(239, 68, 68, 0.88), transparent 26%),
    radial-gradient(circle at 15% 5%, rgba(250, 204, 21, 0.48), transparent 28%),
    linear-gradient(145deg, #5a1717 0%, #b42318 48%, #6d1f7c 100%);
}

.coach-hero.fraud {
  background:
    radial-gradient(circle at 82% 16%, rgba(239, 68, 68, 0.92), transparent 26%),
    radial-gradient(circle at 15% 5%, rgba(249, 115, 22, 0.5), transparent 28%),
    linear-gradient(145deg, #3b1020 0%, #8b1735 52%, #6823a8 100%);
}

.coach-hero.overdraft {
  background:
    radial-gradient(circle at 82% 16%, rgba(249, 115, 22, 0.92), transparent 26%),
    radial-gradient(circle at 15% 5%, rgba(250, 204, 21, 0.52), transparent 28%),
    linear-gradient(145deg, #4d2410 0%, #b94e12 52%, #6f2b8e 100%);
}

.coach-hero::after {
  content: "";
  position: absolute;
  inset: auto -70px -120px auto;
  width: 240px;
  height: 240px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.13);
}

.hero-top,
.hero-actions {
  position: relative;
  z-index: 1;
}

.state-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  max-width: 100%;
  padding: 9px 12px;
  border-radius: 999px;
  color: #ecfffb;
  background: rgba(255, 255, 255, 0.14);
  font-size: 12px;
  font-weight: 800;
  text-transform: uppercase;
}

.state-pill.stable {
  background: rgba(34, 197, 94, 0.2);
}

.state-pill.watching {
  background: rgba(250, 204, 21, 0.24);
  color: #fff8d1;
}

.state-pill.critical {
  background: rgba(239, 68, 68, 0.28);
}

.state-pill.fraud {
  background: rgba(239, 68, 68, 0.34);
}

.state-pill.overdraft {
  background: rgba(249, 115, 22, 0.34);
}

.state-dot {
  width: 9px;
  height: 9px;
  flex: 0 0 auto;
  border-radius: 999px;
  background: var(--teal);
  box-shadow: 0 0 0 5px rgba(19, 213, 178, 0.15);
}

.state-pill.critical .state-dot,
.coach-hero.critical .state-dot {
  background: var(--coral);
  box-shadow: 0 0 0 5px rgba(255, 111, 97, 0.18);
}

.state-pill.fraud .state-dot,
.coach-hero.fraud .state-dot {
  background: #ff9db1;
  box-shadow: 0 0 0 5px rgba(255, 157, 177, 0.16);
}

.state-pill.overdraft .state-dot,
.coach-hero.overdraft .state-dot {
  background: #ffd27d;
  box-shadow: 0 0 0 5px rgba(255, 210, 125, 0.18);
}

.state-pill.watching .state-dot {
  background: #ffe36b;
  box-shadow: 0 0 0 5px rgba(255, 227, 107, 0.15);
}

.state-pill.stable .state-dot {
  background: #86efac;
  box-shadow: 0 0 0 5px rgba(134, 239, 172, 0.15);
}

.hero-title {
  margin: 18px 0 10px;
  max-width: 310px;
  font-size: 29px;
  line-height: 1.05;
}

.top-meta {
  margin: 0;
  font-size: 12px;
  line-height: 1.35;
  color: var(--muted);
}

.hero-copy {
  max-width: 320px;
  margin-bottom: 18px;
  color: rgba(255, 255, 255, 0.82);
  line-height: 1.45;
}

.hero-copy-trigger {
  display: block;
  width: fit-content;
  max-width: 320px;
  padding: 0;
  border: 0;
  color: inherit;
  background: transparent;
  font: inherit;
  line-height: inherit;
  text-align: left;
  cursor: text;
}

.hero-copy-trigger:hover,
.hero-copy-trigger:focus-visible {
  color: #fff;
  text-decoration: underline;
  text-decoration-thickness: 1.5px;
  text-underline-offset: 3px;
}

[hidden] {
  display: none !important;
}

.hero-copy-link {
  border: 0;
  padding: 0;
  margin: 0;
  background: transparent;
  color: inherit;
  font: inherit;
  text-decoration: underline;
  text-decoration-thickness: 1.5px;
  text-underline-offset: 3px;
  cursor: pointer;
}

.hero-copy-link:hover,
.hero-copy-link:focus-visible {
  color: #fff;
}

.habit-band {
  display: grid;
  gap: 10px;
}

.habit-strip {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
}

.habit-item {
  border: 1px solid var(--line);
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.84);
  padding: 12px 13px;
  display: grid;
  gap: 4px;
}

.habit-item span {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.02em;
  color: var(--muted);
  text-transform: uppercase;
}

.habit-item strong {
  font-size: 14px;
  line-height: 1.2;
}

.habit-item p {
  margin: 0;
  font-size: 12px;
  line-height: 1.35;
  color: var(--muted);
}

.safe-spend {
  display: grid;
  grid-template-columns: auto 1fr;
  align-items: center;
  gap: 14px;
  margin-bottom: 14px;
}

.dial {
  width: 92px;
  height: 92px;
  display: grid;
  place-items: center;
  border-radius: 999px;
  background:
    conic-gradient(from 230deg, var(--coral) 0deg, var(--amber) 86deg, var(--teal) 180deg, rgba(255, 255, 255, 0.22) 181deg),
    rgba(255, 255, 255, 0.12);
}

.dial-inner {
  width: 68px;
  height: 68px;
  display: grid;
  place-items: center;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.94);
  color: var(--green);
  font-size: 24px;
  font-weight: 900;
}

.safe-label {
  margin: 0;
  color: rgba(255, 255, 255, 0.68);
  font-size: 12px;
  font-weight: 800;
  text-transform: uppercase;
}

.safe-detail {
  margin: 4px 0 0;
  color: #fff;
  font-weight: 750;
}

.hero-actions {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 2px;
  scroll-snap-type: x proximity;
}

.coach-action {
  flex: 0 0 auto;
  min-width: 128px;
  min-height: 42px;
  padding: 10px 12px;
  color: #05271f;
  border-radius: 16px;
  background: linear-gradient(135deg, #b8ffe7, #43e5bd);
  font-weight: 800;
  font-size: 12px;
  text-align: left;
  box-shadow: 0 10px 20px rgba(5, 46, 38, 0.18);
}

.action-row {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
  margin: 8px 0;
}

.chip {
  min-height: 54px;
  display: grid;
  place-items: center;
  gap: 3px;
  padding: 8px 4px;
  color: var(--ink);
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.74);
  box-shadow: inset 0 0 0 1px var(--line);
  font-size: 11px;
  font-weight: 850;
}

.chip span:first-child,
.nav-item span:first-child {
  font-size: 22px;
}

.chip svg {
  width: 20px;
  height: 20px;
  display: block;
}

.chip span:first-child {
  display: grid;
  place-items: center;
}

.section-title {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 12px;
  margin: 14px 2px 8px;
}

.section-title h2 {
  margin: 0;
  font-size: 18px;
}

.section-title p {
  margin: 0;
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
}

.card-stack {
  display: grid;
  gap: 10px;
}

.horizontal-rail,
.coaching-rail {
  display: flex;
  gap: 10px;
  margin-inline: -16px;
  overflow-x: auto;
  padding: 0 16px 8px;
  scroll-padding-inline: 16px;
  scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
}

.horizontal-rail::-webkit-scrollbar,
.coaching-rail::-webkit-scrollbar,
.hero-actions::-webkit-scrollbar {
  display: none;
}

.context-card,
.section-card,
.list-card,
.workflow-card,
.settings-card {
  border-radius: 22px;
  background: var(--panel);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.86), 0 8px 22px rgba(33, 45, 72, 0.08);
  backdrop-filter: blur(18px);
}

.context-card {
  flex: 0 0 46%;
  scroll-snap-align: start;
  display: grid;
  grid-template-columns: 42px 1fr;
  align-items: center;
  gap: 10px;
  width: auto;
  min-height: 116px;
  padding: 12px;
  text-align: left;
  color: var(--ink);
}

.card-icon {
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  border-radius: 16px;
  background: linear-gradient(135deg, rgba(49, 87, 255, 0.15), rgba(19, 213, 178, 0.2));
  font-size: 23px;
}

.card-type {
  margin: 0 0 3px;
  color: var(--blue);
  font-size: 11px;
  font-weight: 900;
  text-transform: uppercase;
}

.context-card h3,
.list-card h3,
.workflow-card h3 {
  margin: 0 0 4px;
  font-size: 15px;
  line-height: 1.2;
}

.context-card p,
.list-card p,
.workflow-card p,
.settings-card p {
  margin: 0;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.35;
}

.arrow {
  display: none;
  color: var(--muted);
  font-size: 22px;
}

.section-card {
  flex: 0 0 86%;
  scroll-snap-align: start;
  padding: 15px;
}

.section-card + .section-card {
  margin-top: 0;
}

.list-item {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 12px;
  padding: 10px 0;
  border-top: 1px solid var(--line);
}

.list-item:first-child {
  padding-top: 0;
  border-top: 0;
}

.list-item strong {
  display: block;
  margin-bottom: 3px;
}

.list-item small {
  display: block;
  color: var(--muted);
  line-height: 1.35;
}

.impact,
.status-badge {
  white-space: nowrap;
  padding: 7px 9px;
  border-radius: 999px;
  color: #064c3e;
  background: rgba(19, 213, 178, 0.18);
  font-size: 12px;
  font-weight: 900;
}

.attention {
  color: #76510b;
  background: rgba(255, 191, 71, 0.24);
}

.pressure {
  color: #8b2e25;
  background: rgba(255, 111, 97, 0.15);
}

.cta {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 40px;
  margin-top: 10px;
  padding: 10px 14px;
  border-radius: 15px;
  color: #fff;
  background: linear-gradient(135deg, var(--blue), var(--violet));
  font-weight: 850;
}

.cta.secondary {
  color: var(--ink);
  background: rgba(255, 255, 255, 0.72);
  box-shadow: inset 0 0 0 1px var(--line);
}

.screen-heading {
  margin: 2px 2px 14px;
}

.screen-heading p {
  margin: 0;
  color: var(--muted);
  line-height: 1.45;
}

.nav-item svg,
.icon-button svg {
  width: 22px;
  height: 22px;
  display: block;
}

.metric-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  margin-bottom: 12px;
}

.metric {
  padding: 15px;
  border-radius: 20px;
  background: var(--panel-strong);
  box-shadow: inset 0 0 0 1px var(--line);
}

.metric span {
  display: block;
  margin-bottom: 7px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 800;
  text-transform: uppercase;
}

.metric strong {
  font-size: 24px;
}

.list-card,
.workflow-card,
.settings-card {
  padding: 15px;
  margin-bottom: 10px;
}

.progress-track {
  height: 10px;
  overflow: hidden;
  margin-top: 10px;
  border-radius: 999px;
  background: rgba(18, 24, 38, 0.08);
}

.progress-fill {
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--teal), var(--blue));
}

.insight-hero {
  display: grid;
  gap: 14px;
}

.insight-hero-copy h2 {
  margin: 6px 0 8px;
  font-size: 22px;
  line-height: 1.15;
}

.insight-hero-copy p:last-child {
  color: var(--muted);
}

.insight-gauge {
  display: grid;
  gap: 8px;
  padding: 14px;
  border-radius: 18px;
  background: linear-gradient(135deg, rgba(49, 87, 255, 0.07), rgba(19, 213, 178, 0.12));
  box-shadow: inset 0 0 0 1px var(--line);
}

.gauge-label {
  color: var(--muted);
  font-size: 12px;
  font-weight: 800;
  text-transform: uppercase;
}

.gauge-value {
  color: var(--ink);
  font-size: 30px;
  font-weight: 950;
  line-height: 1;
}

.gauge-track {
  height: 10px;
  overflow: hidden;
  border-radius: 999px;
  background: rgba(18, 24, 38, 0.08);
}

.gauge-track span {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--amber), var(--coral));
}

.insight-grid {
  display: grid;
  gap: 10px;
}

.insight-card {
  position: relative;
  display: grid;
  gap: 10px;
  padding: 15px;
  border-radius: 20px;
  background: var(--panel-strong);
  box-shadow: inset 0 0 0 1px var(--line);
}

.insight-card strong {
  display: block;
  font-size: 16px;
  line-height: 1.25;
}

.insight-card p {
  color: var(--muted);
  line-height: 1.45;
}

.insight-badge {
  display: inline-flex;
  align-items: center;
  width: fit-content;
  padding: 7px 10px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: 0.02em;
}

.insight-badge.warning {
  color: #7b4f08;
  background: rgba(255, 191, 71, 0.22);
}

.insight-badge.info {
  color: #0c4d78;
  background: rgba(14, 165, 233, 0.16);
}

.insight-badge.danger {
  color: #8b2e25;
  background: rgba(239, 68, 68, 0.13);
}

.insight-bars {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  align-items: end;
  gap: 8px;
  min-height: 76px;
  padding: 10px 6px 2px;
  border-radius: 16px;
  background: linear-gradient(180deg, rgba(18, 24, 38, 0.03), rgba(18, 24, 38, 0.01));
}

.insight-bars span {
  display: block;
  border-radius: 999px 999px 4px 4px;
  background: linear-gradient(180deg, var(--teal), var(--blue));
}

.mini-donut {
  position: relative;
  width: 100%;
  max-width: 152px;
  aspect-ratio: 1;
  margin: 0 auto;
  border-radius: 50%;
  background:
    conic-gradient(from 240deg, var(--coral), var(--green), var(--blue), rgba(18, 24, 38, 0.08) 0);
}

.mini-donut::after {
  content: "";
  position: absolute;
  inset: 14px;
  border-radius: inherit;
  background: var(--panel-strong);
  box-shadow: inset 0 0 0 1px var(--line);
}

.mini-donut span {
  position: absolute;
  inset: 24px;
  z-index: 1;
  border-radius: inherit;
  background: conic-gradient(from 240deg, var(--coral) 0 calc(var(--value) * 3.6deg), rgba(18, 24, 38, 0.08) 0);
}

.insight-score {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.insight-score div {
  padding: 12px;
  border-radius: 16px;
  background: rgba(18, 24, 38, 0.03);
}

.insight-score span {
  display: block;
  margin-bottom: 4px;
  color: var(--muted);
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
}

.insight-score strong {

const STORAGE_KEY = "fincoach-prototype-state-v2";

function loadSavedState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const saved = JSON.parse(raw);
    if (saved && typeof saved === "object") {
      if (typeof saved.onboardingComplete === "boolean") state.onboardingComplete = saved.onboardingComplete;
      if (typeof saved.onboardingStep === "number") state.onboardingStep = saved.onboardingStep;
      if (typeof saved.route === "string") state.route = saved.route;
      if (typeof saved.lastRoute === "string") state.lastRoute = saved.lastRoute;
      if (saved.userProfile && typeof saved.userProfile === "object") {
        state.userProfile = { ...state.userProfile, ...saved.userProfile };
      }
      user.preferredName = state.userProfile.displayName || user.preferredName;
      if (Array.isArray(saved.completedActions)) state.completedActions = saved.completedActions;
      if (typeof saved.transferApplied === "boolean") state.transferApplied = saved.transferApplied;
      if (Array.isArray(saved.pinnedCardIds)) state.pinnedCardIds = saved.pinnedCardIds;
      if (typeof saved.demoScenario === "string") state.demoScenario = saved.demoScenario;
      if (typeof saved.budgetEditId === "string" || saved.budgetEditId === null) state.budgetEditId = saved.budgetEditId;
      if (saved.budgetDraft && typeof saved.budgetDraft === "object") state.budgetDraft = { ...state.budgetDraft, ...saved.budgetDraft };
      if (typeof saved.goalEditId === "string" || saved.goalEditId === null) state.goalEditId = saved.goalEditId;
      if (saved.goalDraft && typeof saved.goalDraft === "object") state.goalDraft = { ...state.goalDraft, ...saved.goalDraft };
      if (saved.adminState && typeof saved.adminState === "object") state.adminState = { ...state.adminState, ...saved.adminState };
      if (typeof saved.billReminderView === "string") state.billReminderView = saved.billReminderView;
      if (saved.habitState && typeof saved.habitState === "object") {
        state.habitState = { ...state.habitState, ...saved.habitState };

      if (saved.notificationPrefs && typeof saved.notificationPrefs === "object") {
        state.notificationPrefs = {
          ...state.notificationPrefs,
          ...saved.notificationPrefs,
          channels: { ...state.notificationPrefs.channels, ...(saved.notificationPrefs.channels || {}) },
        };
      }
      if (Array.isArray(saved.coachMessages)) state.coachMessages = saved.coachMessages;
      if (Array.isArray(saved.wins)) state.wins = saved.wins;
    }
  } catch (error) {
    console.warn("Unable to load saved state", error);
  }
}

function saveState() {
  try {
    const payload = {
      onboardingComplete: state.onboardingComplete,
      onboardingStep: state.onboardingStep,
      route: state.route,
      lastRoute: state.lastRoute,
      userProfile: state.userProfile,
      completedActions: state.completedActions,

      demoScenario: state.demoScenario,

      goalDraft: state.goalDraft,

      habitState: state.habitState,
      notificationPrefs: state.notificationPrefs,

    localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
  } catch (error) {

}

function updateAppCheckInHabit() {
  const today = new Date().toISOString().slice(0, 10);
  const lastSeen = state.habitState.lastSeenDate;
  if (lastSeen === today) return;

  const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
  state.habitState.appCheckInStreak = lastSeen === yesterday ? state.habitState.appCheckInStreak + 1 : 1;
  state.habitState.lastSeenDate = today;
}

function habitModel(snapshot) {
  if (snapshot.billPressure === "high" || snapshot.safeToSpend < 0) {
    return {
      stage: "Protect",
      cue: "Plan or pay bills before spending.",
      action: "Review bills first",
      reward: "Stay ahead of surprise expenses",
      next: "Build savings after essentials are safe",
    };
  }

  if (snapshot.safeToSpend < 150) {
    return {
      stage: "Save",
      cue: "Set aside a small amount before it disappears.",
      action: "Move money to savings",
      reward: "Grow a buffer with less effort",
      next: "Protect a minimum balance",
    };
  }

  return {
    stage: "Grow",
    cue: "Route spare dollars toward future goals.",
    action: "Review goals and grow cushion",
    reward: "Build momentum toward investing",
    next: "Learn about small investing steps",
  };
}

const bills = [

const transactions = [
  { id: "t1", merchant: "Fresh Market", amount: -38.42, category: "Groceries", date: "Today", reviewed: true },
  { id: "t2", merchant: "Blue Bottle", amount: -6.8, category: "Dining", date: "Yesterday", reviewed: true },

];

const categories = [
  { id: "c1", name: "Groceries", spent: 248, target: 300 },
  { id: "c2", name: "Dining", spent: 126, target: 140 },
  { id: "c3", name: "Transport", spent: 82, target: 160 },
];

const goals = [
  { id: "g1", name: "Emergency buffer", currentAmount: 720, targetAmount: 1200 },
  { id: "g2", name: "Move-in cushion", currentAmount: 310, targetAmount: 900 },
];

function currency(value) {
  return new Intl.NumberFormat("en-US", {
    style: "currency",
    currency: "USD",
    maximumFractionDigits: 0,
  }).format(value);
}

function currencyInputValue(value) {
  return Number.isFinite(value) ? String(value) : "";
}
function buildBudgetSeed(profile) {
  const monthlyIncome = Math.max(Number(profile.monthlyIncome) || 0, 0);
  const essentials = Math.max(Number(profile.monthlyEssentials) || 0, 0);
  const incomeType = profile.incomeType || "salary";
  const incomeConfidence = incomeType === "gig" ? 0.72 : incomeType === "mixed" ? 0.88 : 1;
  const taxReserveRate = incomeType === "gig" ? 0.18 : incomeType === "mixed" ? 0.12 : 0.08;
  const conservativeIncome = Math.max(0, Math.round(monthlyIncome * incomeConfidence));
  const taxReserve = Math.round(conservativeIncome * taxReserveRate);
  const remaining = Math.max(0, conservativeIncome - essentials - taxReserve);
  const discretionary = Math.max(0, Math.round(remaining * 0.22));
  const savings = Math.max(0, Math.round(remaining * 0.18));
  const transport = Math.max(0, Math.round(remaining * 0.14));
  const dining = Math.max(0, Math.round(remaining * 0.12));
  const groceries = Math.max(0, Math.round(remaining * 0.18));
  const misc = Math.max(0, remaining - (discretionary + savings + transport + dining + groceries));

  return [
    { id: "seed-housing", name: "Housing", spent: Math.max(0, Math.round(essentials * 0.58)), target: Math.max(0, Math.round(essentials * 0.6)) },
    { id: "seed-groceries", name: "Groceries", spent: 0, target: groceries || 200 },
    { id: "seed-transport", name: "Transport", spent: 0, target: transport || 120 },
    { id: "seed-dining", name: "Dining", spent: 0, target: dining || 80 },
    { id: "seed-savings", name: "Savings", spent: 0, target: savings || 150 },
    { id: "seed-tax", name: "Tax reserve", spent: 0, target: taxReserve || 100 },
    { id: "seed-discretionary", name: "Discretionary", spent: 0, target: discretionary || misc || 100 },
  ];
}

function applyBudgetSeedFromOnboarding() {
  const seeded = buildBudgetSeed(state.userProfile);
  categories.splice(0, categories.length, ...seeded);
}

function buildGoalSeed(profile) {
  const goalPriority = profile.goalPriority || "buffer";
  const emergencyBuffer = { id: "goal-buffer", name: "Emergency buffer", currentAmount: 0, targetAmount: 1200 };
  if (goalPriority === "debt") {
    return [
      { id: "goal-debt", name: "Pay down debt", currentAmount: 0, targetAmount: 2500 },
      emergencyBuffer,
    ];
  }
  if (goalPriority === "savings") {
    return [
      { id: "goal-savings", name: "Grow savings", currentAmount: 0, targetAmount: 2000 },
      emergencyBuffer,
    ];
  }
  return [
    emergencyBuffer,
    { id: "goal-momentum", name: "Monthly breathing room", currentAmount: 0, targetAmount: 600 },
  ];
}

function applyGoalSeedFromOnboarding() {
  const seeded = buildGoalSeed(state.userProfile);
  goals.splice(0, goals.length, ...seeded);
}

function ensureEmergencyBufferGoal() {
  const hasEmergencyBuffer = goals.some((goal) => goal.name === "Emergency buffer");
  if (!hasEmergencyBuffer) {
    goals.unshift({ id: "goal-buffer", name: "Emergency buffer", currentAmount: 0, targetAmount: 1200 });
  }
}

function buildPhoneNotifications(snapshot) {
  const items = [];
  if (snapshot.safeToSpend < 0) {
    items.push({
      id: "phone-low-balance",
      level: "critical",
      title: "Bank alert: low balance",
      body: `Checking is short by ${currency(Math.abs(snapshot.safeToSpend))} after essentials.`,
      route: "paydays",
    });
  } else if (snapshot.safeToSpend < 150) {
    items.push({
      id: "phone-low-balance-watch",
      level: "warning",
      title: "Bank alert: balance getting tight",
      body: `Only ${currency(snapshot.safeToSpend)} remains after upcoming bills.`,
      route: "cash-flow",
    });
  }

  const overspendingCategory = snapshot.categoryPressure.find((category) => category.pressure === "high");
  if (overspendingCategory) {
    items.push({
      id: "phone-overspending",
      level: "warning",
      title: `Spending alert: ${overspendingCategory.name}`,
      body: `${overspendingCategory.name} is ${Math.round(overspendingCategory.ratio * 100)}% of budget.`,
      route: "budgets",
    });
  }

  if (!items.length) {
    items.push({
      id: "phone-ok",
      level: "info",
      title: "Notifications quiet",
      body: "No urgent balance or overspending alerts right now.",
      route: "home",
    });
  }

  return items;
}

function buildBillReminders(snapshot) {
  const reminders = [];
  const nextBills = bills.filter((bill) => ["upcoming", "scheduled"].includes(bill.status)).slice(0, 3);
  const recurringTransactions = transactions.filter((transaction) => transaction.isRecurring);
  const payDay = state.userProfile.paycheckDay || "Friday";

  reminders.push({
    id: "onboarding-paycheck",
    source: "Onboarding",
    title: `Payday expectation set to ${payDay}`,
    body: `FinCoach uses your income timing and paycheck day to place bill reminders earlier when income is variable.`,
    route: "paydays",
  });

  nextBills.forEach((bill) => {
    reminders.push({
      id: `bill-${bill.id}`,
      source: bill.isEssential ? "Bill schedule" : "Optional bill",
      title: `${bill.name} due ${bill.dueDate}`,
      body: `${currency(bill.amount)} is scheduled as ${bill.status}.`,
      route: bill.id === "b1" ? "move-savings" : "cash-flow",
    });
  });

  const reviewNeeded = transactions.filter((transaction) => !transaction.reviewed).length;
  if (reviewNeeded > 0) {
    reminders.push({
      id: "transaction-review",
      source: "Transaction pattern",
      title: `${reviewNeeded} transaction${reviewNeeded === 1 ? "" : "s"} still need review`,
      body: "FinCoach treats unreviewed activity as a signal to keep budgets and reminder timing accurate.",
      route: "transactions",
    });
  }

  if (recurringTransactions.length) {
    reminders.push({
      id: "recurring-detect",
      source: "Pattern detection",
      title: `${recurringTransactions.length} recurring transaction${recurringTransactions.length === 1 ? "" : "s"} detected`,
      body: "Recurring items can become bill reminders or expected spending alerts later.",
      route: "categorization",
    });
  }

  if (snapshot.billPressure === "high" || snapshot.safeToSpend < 150) {
    reminders.push({
      id: "urgent-timing",
      source: "Cash-flow engine",
      title: "Timing reminder enabled early",
      body: "High bill pressure moves reminders earlier so the user has time to act before harm happens.",
      route: "cash-flow",
    });
  }

  return reminders.slice(0, 5);
}

function deriveFinancialSnapshot() {
  const checking = accounts.find((account) => account.type === "checking").availableBalance;
  const essentialBills = bills
    .filter((bill) => bill.isEssential && ["upcoming", "scheduled"].includes(bill.status))
    .reduce((sum, bill) => sum + bill.amount, 0);
  const safeToSpend = checking - essentialBills;
  const unreadAlerts = transactions.filter((transaction) => !transaction.reviewed).length;
  const tight = safeToSpend < 0;
  const incomeType = state.userProfile.incomeType || "salary";
  const incomeConfidence = incomeType === "gig" ? 0.72 : incomeType === "mixed" ? 0.88 : 1;
  const taxReserveRate = incomeType === "gig" ? 0.18 : incomeType === "mixed" ? 0.12 : 0.08;
  const conservativeMonthlyIncome = Math.max(0, Math.round(state.userProfile.monthlyIncome * incomeConfidence));
  const taxReserve = Math.round(conservativeMonthlyIncome * taxReserveRate);
  const categoryPressure = categories.map((category) => ({
    ...category,
    ratio: category.spent / category.target,
    pressure: category.spent / category.target > 0.85 ? "high" : category.spent / category.target > 0.7 ? "medium" : "low",
  }));
  const alerts = [];
  if (safeToSpend < 0) {
    alerts.push({
      id: "low-balance",
      level: "critical",
      title: "Low balance risk",
      body: `You are ${currency(Math.abs(safeToSpend))} short after upcoming essentials.`,
      route: "paydays",
    });
  } else if (safeToSpend < 150) {
    alerts.push({
      id: "low-balance-watch",
      level: "warning",
      title: "Low balance watch",
      body: `Only ${currency(safeToSpend)} is left after near-term bills.`,
      route: "cash-flow",
    });
  }

  const overspendingCategory = categoryPressure.find((category) => category.pressure === "high");
  if (overspendingCategory) {
    alerts.push({
      id: "overspending",
      level: "warning",
      title: `${overspendingCategory.name} is over plan`,
      body: `${overspendingCategory.name} is using ${Math.round(overspendingCategory.ratio * 100)}% of its monthly target.`,
      route: "budgets",
    });
  }

  if (unreadAlerts > 0) {
    alerts.push({
      id: "transaction-review",
      level: "info",
      title: `${unreadAlerts} transaction${unreadAlerts === 1 ? "" : "s"} need review`,
      body: "A quick review keeps budgets and alerts accurate.",
      route: "transactions",
    });
  }

  return {
    financialState: tight ? "tight" : safeToSpend > 150 ? "stable" : "watching",
    billPressure: tight ? "high" : safeToSpend < 150 ? "medium" : "low",
    safeToSpend,
    unreadAlerts,
    streakDays: state.wins.length + state.completedActions.length,
    categoryPressure,
    incomeType,
    conservativeMonthlyIncome,
    taxReserve,
    monthlyFlexibleSurplus: conservativeMonthlyIncome - state.userProfile.monthlyEssentials - taxReserve,
    projectedBufferMonths: Math.max(
      0,
      Math.round((state.userProfile.monthlyEssentials / Math.max(conservativeMonthlyIncome - state.userProfile.monthlyEssentials - taxReserve, 1)) * 10) / 10,
    ),
    alerts,
  };
}

function normalizeNavRoute(route) {
  if (["budgets", "bills", "transactions", "categorization", "paydays"].includes(route)) return "budgets";
  if (route === "accounts") return "accounts";
  if (["reports", "insights", "cash-flow", "goals"].includes(route)) return "insights";
  if (route === "habits") return "insights";
  if (["workflows", "coach-chat", "hidden-savings", "log-win", "move-savings", "subscription-review", "stocks-waitlist"].includes(route)) return "workflows";
  if (["login", "sign-up", "forgot-password", "identity-check", "create-password", "admin", "phone-os"].includes(route)) return "settings";
  if (route === "settings") return "settings";
  return "home";
}

      let reply = coachReply(question, snapshot);

        const response = await fetch("http://127.0.0.1:3001/api/coach", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question, snapshot, strategies: heroStrategies(snapshot) }),

function completeAction(label) {
  state.completedActions.push(label);

  if (label.includes("Logged today's win")) {
    state.wins.unshift({
      id: `w${Date.now()}`,
      title: "Logged today's money win",
      date: "Today",
      source: "manual",
    });
  }

  if ((label.includes("Moved $50") || label.includes("Added $50")) && !state.transferApplied) {
    const checking = accounts.find((account) => account.type === "checking");
    const savings = accounts.find((account) => account.type === "savings");
    checking.balance += 50;
    checking.availableBalance += 50;
    savings.balance -= 50;
    savings.availableBalance -= 50;
    state.transferApplied = true;
  }
}

function coachReply(question, snapshot = deriveFinancialSnapshot()) {
  const lower = question.toLowerCase();
  if (lower.includes("100") || lower.includes("hidden") || lower.includes("find") || lower.includes("save")) {
    return `I found a possible $100 in breathing room: $22 from a subscription pause, $30 from dining guardrails, $15 from a grocery offer, $18 from transport timing, and $15 from moving leftover bill buffer after electric clears. Because your current safe-to-spend amount is ${currency(snapshot.safeToSpend)}, I would review the bills first and treat these as options, not promises.`;
  }

  if (lower.includes("why") || lower.includes("rent") || lower.includes("bill")) {
    return `The main pressure is timing: ${currency(snapshot.safeToSpend)} is left after near-term essentials, with ${snapshot.billPressure} bill pressure. The lowest-stress path is to protect the next essential bill first, then review flexible spending after essentials are safe.`;
  }

  if (lower.includes("safe") || lower.includes("afford") || lower.includes("spend today") || lower.includes("spend")) {
    return snapshot.safeToSpend < 0
      ? `Right now, I would treat your safe-to-spend amount as $0. The forecast is ${currency(Math.abs(snapshot.safeToSpend))} short after upcoming essentials, so spending more could increase the gap. Let’s protect the bills first, then reassess after the next income arrives.`
      : `Your current safe-to-spend estimate is ${currency(snapshot.safeToSpend)} after upcoming essentials. That is a planning estimate, not permission to spend it all at once; leave room for pending transactions and your next bill.`;
  }

  if (lower.includes("how long") || lower.includes("covered") || lower.includes("days") || lower.includes("protected")) {
    const essentialTotal = bills.filter((bill) => bill.isEssential && ["upcoming", "scheduled"].includes(bill.status)).reduce((sum, bill) => sum + bill.amount, 0);
    const coverage = Math.max(0, Math.floor((snapshot.safeToSpend + essentialTotal) / Math.max(essentialTotal, 1) * 7));
    return snapshot.safeToSpend < 0
      ? `Your current balance does not fully cover the ${currency(essentialTotal)} of upcoming essentials; the forecast is ${currency(Math.abs(snapshot.safeToSpend))} short. I would treat the bills as needing action now rather than assuming they are protected.`
      : `Your current balance covers the listed upcoming essentials of ${currency(essentialTotal)}. Based on this snapshot, that gives you roughly ${coverage} days of breathing room before we should reassess, especially when pending transactions or income timing changes.`;
  }

  if (lower.includes("goal") || lower.includes("vacation") || lower.includes("emergency") || lower.includes("buffer")) {
    const primaryGoal = goals[0];
    const remaining = Math.max(0, primaryGoal.targetAmount - primaryGoal.currentAmount);
    return snapshot.safeToSpend < 0
      ? `Your ${primaryGoal.name.toLowerCase()} is ${currency(remaining)} from its target, but the immediate priority is the ${currency(Math.abs(snapshot.safeToSpend))} near-term gap. Protect essentials first; a small goal contribution can restart after the next income arrives.`
      : `Your ${primaryGoal.name.toLowerCase()} is ${currency(remaining)} from its target. Because ${currency(snapshot.safeToSpend)} remains after essentials, you can compare a small buffer contribution with your other goal and choose the one that gives you the most confidence.`;
  }

  if (lower.includes("savings")) {
    return snapshot.safeToSpend < 0
      ? `I would not move money to savings before the essentials are covered. Your current gap is ${currency(Math.abs(snapshot.safeToSpend))}; first review bill timing or breathing-room options, then restart with a small transfer.`
      : `A small savings action fits this moment because ${currency(snapshot.safeToSpend)} remains after essentials. Start with $10-$50, then revisit after your next payday.`;
  }

  if (lower.includes("learn") || lower.includes("lesson")) {
    return "A helpful lesson here is buffer before budget: when cash timing is tight, a small liquid cushion matters more than perfect category tracking.";
  }

  return snapshot.unreadAlerts > 0
    ? `What matters now is reducing surprise. You have ${snapshot.unreadAlerts} transaction${snapshot.unreadAlerts === 1 ? "" : "s"} to review, and your safe-to-spend amount is ${currency(snapshot.safeToSpend)}. I would review those before choosing a larger move.`
    : `What matters now is choosing one manageable next step. Your safe-to-spend amount is ${currency(snapshot.safeToSpend)} after essentials, so I would ${snapshot.financialState === "stable" ? "build the emergency buffer or move money toward a goal" : "review cash timing before committing to a new transfer"}.`;
}

function recommendedWorkflows(snapshot) {
  const highCategory = snapshot.categoryPressure.find((category) => category.pressure === "high");
  const needsReview = transactions.filter((transaction) => !transaction.reviewed).length;
  const workflows = [
    {
      title: "Ask FinCoach",
      copy: "Talk through what matters now and get the rationale behind the suggested paths.",
      route: "coach-chat",
      tag: "Coach",
    },
    {
      title: "Find $100 hidden savings",
      copy: "Scan subscriptions, category leakage, timing, and offers for realistic breathing room.",
      route: "hidden-savings",
      tag: "Scan",
    },
  ];

  if (snapshot.billPressure === "high") {
    workflows.push({
      title: "Protect upcoming rent",
      copy: "The current bill timing creates pressure. Compare a small transfer against the bill calendar.",
      route: "move-savings",
      tag: "High priority",
    });
  } else {
    workflows.push({
      title: "Review bills and paydays",
      copy: "Bills are manageable, but timing still matters. Check the next payday and upcoming obligations.",
      route: "paydays",
      tag: "Timing",
    });
  }

  if (highCategory) {
    workflows.push({
      title: `Review ${highCategory.name}`,
      copy: "This category is close to its target. A quick look can prevent a surprise later.",
      route: "budgets",
      tag: "Budget",
    });
  }

  if (needsReview > 0) {
    workflows.push({
      title: `Categorize ${needsReview} transactions`,
      copy: "Clearing these improves budget accuracy and FinCoach recommendations.",
      route: "categorization",
      tag: "Review",
    });
  }

  workflows.push({
    title: "Log today's win",
    copy: "Record one positive action so momentum stays visible.",
    route: "log-win",
    tag: "Habit",
  });

  return workflows.slice(0, 5);
}

function screenHeading(title, copy) {
  return `<div class="screen-heading"><p>${copy}</p></div>`;
}

function metric(label, value) {
  return `<div class="metric"><span>${label}</span><strong>${value}</strong></div>`;
}

function workflowCard(title, copy, route) {
  return `
    <article class="workflow-card">
      <h3>${title}</h3>
      <p>${copy}</p>
      <button class="cta" type="button" data-route="${route}">Start</button>
    </article>
  `;
}

document.querySelectorAll("[data-route]").forEach((button) => {
  button.addEventListener("click", () => setRoute(button.dataset.route));
});

if ("serviceWorker" in navigator && location.protocol !== "file:") {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}

render();
